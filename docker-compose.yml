# ============================================================
#  一键起全套：Redis + Qdrant + API
#
#  用法（本地开发 —— 会自动加载 docker-compose.override.yml）：
#    docker compose up -d            启动全部
#    docker compose up -d --build    改了代码后重建并启动
#    docker compose ps               看状态
#    docker compose logs -f api      看 API 日志
#    docker compose down             停掉（数据卷保留）
#    docker compose down -v          连数据卷一起删（⚠️ 数据没了）
#
#  用法（生产部署 —— 不加载 override，见 DEPLOY.md）：
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  启动后：
#    http://localhost:8000           API + 演示页面
#    http://localhost:6333/dashboard Qdrant Web UI
#
#  ⚠️ 安全设计：Redis 和 Qdrant 的端口只绑定到 127.0.0.1
#     （即只有宿主机自己能访问，公网访问不到）
#     容器之间通过 compose 网络用服务名通信，不依赖宿主端口。
#     这样即使服务器的防火墙有疏漏，数据库也不会裸奔在公网。
# ============================================================

services:

  # ── Redis：缓存检索结果 + 存 Agent 状态 ──
  redis:
    image: redis:7-alpine
    container_name: mhrag-redis
    ports:
      # ⚠️ 只绑本地：公网无法访问 Redis（裸奔的 Redis 是经典安全事故）
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    # appendonly yes：开启 AOF 持久化，Redis 重启后数据还在
    command: redis-server --appendonly yes
    # healthcheck：让 Docker 能判断"服务是否真的可用"
    # 对比 depends_on 只保证"启动顺序"——healthcheck 才保证"就绪"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Qdrant：向量数据库 ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mhrag-qdrant
    ports:
      # ⚠️ 同样只绑本地，防止向量库暴露到公网
      - "127.0.0.1:6333:6333"   # REST API + Web UI（http://localhost:6333/dashboard）
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # ── Web 层：FastAPI 服务 ──
  api:
    build: .                    # 用当前目录的 Dockerfile 构建
    container_name: mhrag-api
    ports:
      - "8000:8000"             # 浏览器打开 http://localhost:8000 看演示页
    environment:
      # ⭐ 这里正是「服务名就是域名」——用 redis / qdrant 当主机名，
      #    因为 compose 自动建了网络并做了 DNS 解析
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # 从宿主机 .env 读取（docker compose 会自动加载 .env）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      MHRAG_ROOT: /app
      # ── HuggingFace 相关 ──
      # ⭐ 禁用 Xet 存储后端：
      #    HF 新的 Xet 会 302 重定向到 cas-server.xethub.hf.co，
      #    而 hf-mirror 不代理那个后端 → 会 401 失败。
      #    禁用后退回普通 /resolve/ 下载，镜像站就能正常代理。
      HF_HUB_DISABLE_XET: "1"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      # 模型缓存挂出来，重建容器不用重新下载 BGE 模型（约 130MB）
      - hf-cache:/root/.cache/huggingface
    depends_on:
      redis:
        # ⭐ 这里用了 healthcheck 条件——真正等 redis「就绪」而不只是「启动」
        #    （只写 depends_on: [redis] 是保证不了就绪的）
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  hf-cache:
